<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:854px;width:1280px;overflow:hidden}.tile{display:grid;grid-template-columns:1fr 316px;height:854px;width:1280px}.mark{background:var(--obs-primary-container);display:grid;place-items:center;padding:0 48px}.mark span{font-family:var(--font-mono);font-weight:600;font-size:96px;letter-spacing:-0.04em;color:#fff;white-space:nowrap;line-height:1}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip i{display:block}</style>
</head><body><div class="tile">
<div class="mark"><span>obsidian</span></div>
<div class="strip"><i style="background:var(--obs-secondary-fixed)"></i><i style="background:var(--obs-secondary-container)"></i><i style="background:var(--obs-tertiary-container)"></i><i style="background:var(--obs-surface-container-lowest)"></i></div>
</div></body></html>
