<!-- @dsCard group="Depth" viewport="700x190" name="Elevation strata" subtitle="Canvas → docked → glass overlay" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--surface-app)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body><div style="position:relative;height:150px;background:var(--surface-canvas);border:1px solid var(--hairline);border-radius:var(--radius);overflow:hidden">
<div style="position:absolute;inset:0;padding:8px;font:400 var(--body-sm-size)/1.6 var(--font-mono);color:var(--syntax-comment)">// level 0 · editor canvas</div>
<div style="position:absolute;left:12px;top:26px;width:200px;height:110px;background:var(--surface-docked);border:1px solid var(--hairline);border-radius:var(--radius);padding:8px;font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);color:var(--text-secondary)">LEVEL 1 · DOCKED</div>
<div style="position:absolute;left:150px;top:52px;width:340px;height:76px;background:var(--glass-fill);backdrop-filter:var(--glass-blur);border:1px solid var(--obs-slate-800);border-top:1px solid var(--rim-electric);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);padding:8px;font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);color:var(--obs-primary)">LEVEL 2 · GLASS PALETTE</div>
<div style="position:absolute;right:12px;bottom:10px;width:190px;padding:8px;background:var(--glass-fill);border:1px solid var(--hairline);border-left:2px solid var(--status-warn);border-radius:var(--radius);box-shadow:var(--shadow-toast);font:500 var(--label-md-size)/1 var(--font-mono);color:var(--status-warn)">level 3 · toast</div>
</div></body></html>
