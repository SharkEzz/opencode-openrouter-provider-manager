<!-- @dsCard group="Light Theme" viewport="700x160" name="Ink and accents · light" subtitle="Darker inks keep 4.5:1+ on white" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--app-gradient)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body data-theme="light"><div class="rows">
<div class="r"><span class="k" style="width:110px">primary</span><span style="font:400 var(--body-lg-size)/1.4 var(--font-mono);color:var(--text-primary)">route request to @fast</span></div>
<div class="r"><span class="k" style="width:110px">route</span><span style="font:400 var(--body-md-size)/1.4 var(--font-mono);color:var(--accent-route-ink)">$0.11 in / $0.55 out /M</span></div>
<div class="r"><span class="k" style="width:110px">telemetry</span><span style="font:400 var(--body-md-size)/1.4 var(--font-mono);color:var(--accent-telemetry-ink)">uptime 99.98% · 82 tok/s</span></div>
<div class="r"><span class="k" style="width:110px">meta</span><span style="font:400 var(--body-md-size)/1.4 var(--font-mono);color:var(--accent-meta-ink)">cache 41.2% · gguf</span></div>
</div></body></html>
