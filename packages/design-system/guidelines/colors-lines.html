<!-- @dsCard group="Colors" viewport="700x170" name="Lines and rims" subtitle="Hairlines, outlines, electric rim, glows" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--surface-app)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body><div class="rows">
<div class="r"><span class="k" style="width:130px">hairline .08</span><i style="flex:1;height:1px;background:var(--hairline)"></i></div>
<div class="r"><span class="k" style="width:130px">border-subtle .06</span><i style="flex:1;height:1px;background:var(--border-subtle)"></i></div>
<div class="r"><span class="k" style="width:130px">border-strong</span><i style="flex:1;height:1px;background:var(--border-strong)"></i></div>
<div class="r"><span class="k" style="width:130px">rim-electric</span><i style="flex:1;height:1px;background:var(--rim-electric)"></i></div>
<div class="r" style="margin-top:2px">
<span style="height:28px;flex:1;border-radius:var(--radius);background:var(--surface-pane);border:1px solid var(--hairline);box-shadow:var(--glow-cyan);display:grid;place-items:center;font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);color:var(--obs-secondary)">GLOW CYAN</span>
<span style="height:28px;flex:1;border-radius:var(--radius);background:var(--surface-pane);border:1px solid var(--hairline);box-shadow:var(--glow-blue);display:grid;place-items:center;font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);color:var(--obs-primary)">GLOW BLUE</span>
<span style="height:28px;flex:1;border-radius:var(--radius);background:var(--surface-pane);border:1px solid var(--hairline);box-shadow:var(--glow-magenta);display:grid;place-items:center;font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);color:var(--obs-tertiary)">GLOW MAGENTA</span>
</div></div></body></html>
