<!-- @dsCard group="Colors" viewport="700x150" name="Status semantics" subtitle="Uptime, degradation, fault, error container" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--surface-app)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body><div class="sw"><div style="background:var(--status-ok);color:#04281c"><b>ok</b><span>#10b981</span></div><div style="background:var(--status-warn);color:#3b2503"><b>warn</b><span>#f59e0b</span></div><div style="background:var(--status-fault);color:#3d0a0a"><b>fault</b><span>#ef4444</span></div><div style="background:var(--obs-error);color:#690005"><b>error</b><span>#ffb4ab</span></div><div style="background:var(--obs-error-container);color:#ffdad6"><b>err-ctr</b><span>#93000a</span></div><div style="background:var(--status-idle);color:#f1f5f9"><b>idle</b><span>#64748b</span></div></div><div class="rows" style="margin-top:var(--space-md)"><div class="r">
<span style="display:inline-flex;align-items:center;gap:6px;font:400 var(--body-sm-size)/1 var(--font-mono);color:var(--status-ok)"><i style="width:6px;height:6px;border-radius:99px;background:currentColor;box-shadow:0 0 8px currentColor"></i>uptime 99.98%</span>
<span style="display:inline-flex;align-items:center;gap:6px;font:400 var(--body-sm-size)/1 var(--font-mono);color:var(--status-warn)"><i style="width:6px;height:6px;border-radius:99px;background:currentColor"></i>p50 3.8s</span>
<span style="display:inline-flex;align-items:center;gap:6px;font:400 var(--body-sm-size)/1 var(--font-mono);color:var(--status-fault)"><i style="width:6px;height:6px;border-radius:99px;background:currentColor"></i>429 rate limit</span>
<span style="display:inline-flex;align-items:center;gap:6px;font:400 var(--body-sm-size)/1 var(--font-mono);color:var(--status-idle)"><i style="width:6px;height:6px;border-radius:99px;background:currentColor"></i>cold</span>
</div></div></body></html>
