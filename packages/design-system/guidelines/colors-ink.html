<!-- @dsCard group="Colors" viewport="700x160" name="Text ink" subtitle="Four-step monospace legibility ramp" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--surface-app)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body><div class="rows">
<div class="r"><span class="k" style="width:120px">primary</span><span style="font:400 var(--body-lg-size)/1.4 var(--font-mono);color:var(--text-primary)">route request to @fast</span><span class="k" style="margin-left:auto">#e2e2e2</span></div>
<div class="r"><span class="k" style="width:120px">secondary</span><span style="font:400 var(--body-md-size)/1.4 var(--font-mono);color:var(--text-secondary)">provider · anthropic us-east</span><span class="k" style="margin-left:auto">#c2c6d5</span></div>
<div class="r"><span class="k" style="width:120px">muted</span><span style="font:400 var(--body-md-size)/1.4 var(--font-mono);color:var(--text-muted)">$0.11 in / $0.55 out /M</span><span class="k" style="margin-left:auto">#94a3b8</span></div>
<div class="r"><span class="k" style="width:120px">faint</span><span style="font:400 var(--body-sm-size)/1.4 var(--font-mono);color:var(--text-faint)">ctx 1.1M · cached 96k</span><span class="k" style="margin-left:auto">#64748b</span></div>
</div></body></html>
