<!-- @dsCard group="Light Theme" viewport="700x150" name="Badges and status · light" subtitle="Same alpha tints, darker text for contrast on white" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--app-gradient)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body data-theme="light"><div class="r" style="gap:var(--space-sm);flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--radius);background:var(--obs-blue-20);border:1px solid var(--obs-blue-30);color:var(--accent-route-ink);font:600 var(--label-sm-size)/16px var(--font-mono);letter-spacing:var(--label-sm-ls)">@fast</span>
<span style="display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:var(--radius);background:var(--obs-cyan-20);border:1px solid var(--obs-cyan-20);color:var(--accent-telemetry-ink);font:600 var(--label-sm-size)/16px var(--font-mono);letter-spacing:var(--label-sm-ls)"><i style="width:5px;height:5px;border-radius:99px;background:currentColor"></i>live</span>
<span style="display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--radius);background:var(--obs-magenta-20);border:1px solid var(--obs-magenta-20);color:var(--accent-meta-ink);font:600 var(--label-sm-size)/16px var(--font-mono);letter-spacing:var(--label-sm-ls)">cache 41%</span>
<span style="display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:99px;background:var(--status-ok-bg);border:1px solid var(--status-ok-bg);color:var(--status-ok);font:600 var(--label-sm-size)/16px var(--font-mono);letter-spacing:var(--label-sm-ls)">healthy</span>
<span style="display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:99px;background:var(--status-warn-bg);border:1px solid var(--status-warn-bg);color:var(--status-warn);font:600 var(--label-sm-size)/16px var(--font-mono);letter-spacing:var(--label-sm-ls)">degraded</span>
<span style="display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:99px;background:var(--status-fault-bg);border:1px solid var(--status-fault-bg);color:var(--status-fault);font:600 var(--label-sm-size)/16px var(--font-mono);letter-spacing:var(--label-sm-ls)">429</span>
</div></body></html>
