<!-- @dsCard group="Light Theme" viewport="700x120" name="Surfaces · light" subtitle="Same strata, opt in with [data-theme="light"]" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--app-gradient)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body data-theme="light"><div class="sw"><div style="background:var(--surface-app);color:var(--text-muted)"><b>app</b><span>#f3f5f8</span></div><div style="background:var(--surface-docked);color:var(--text-muted)"><b>docked</b><span>#ffffff</span></div><div style="background:var(--surface-pane);color:var(--text-muted)"><b>pane</b><span>#ffffff</span></div><div style="background:var(--surface-raised);color:var(--text-secondary)"><b>raised</b><span>#eef1f5</span></div><div style="background:var(--accent-route);color:#fff"><b>route fill</b><span>#0058be</span></div><div style="background:var(--surface-selected-tint);color:var(--text-primary)"><b>selected tint</b><span>#e6edfb</span></div></div></body></html>
