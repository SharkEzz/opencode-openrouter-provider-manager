<!-- @dsCard group="Spacing" viewport="700x150" name="4px spacing grid" subtitle="xs 4 · sm 8 · md 12 · lg 16 · xl 24" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--surface-app)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body><div class="r" style="align-items:flex-end;gap:var(--space-lg)">
<div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:var(--space-xs);height:36px;background:var(--accent-route)"></i><span class="k">xs</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:var(--space-sm);height:36px;background:var(--accent-route)"></i><span class="k">sm</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:var(--space-md);height:36px;background:var(--accent-route)"></i><span class="k">md</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:var(--space-lg);height:36px;background:var(--accent-route)"></i><span class="k">lg</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:var(--space-xl);height:36px;background:var(--accent-route)"></i><span class="k">xl</span></div>
<div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:var(--gutter);height:36px;background:var(--accent-telemetry)"></i><span class="k">gutter</span></div>
<div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:var(--margin);height:36px;background:var(--accent-meta)"></i><span class="k">margin</span></div>
</div></body></html>
