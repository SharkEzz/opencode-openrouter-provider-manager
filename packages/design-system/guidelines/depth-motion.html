<!-- @dsCard group="Depth" viewport="700x150" name="Motion" subtitle="90 / 140 / 220ms on an out-ease" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--surface-app)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body><div class="rows">
<div class="r"><span class="k" style="width:120px">fast · 90ms</span><span style="font:400 var(--body-sm-size)/1 var(--font-mono);color:var(--text-muted)">row hover, dot ping</span></div>
<div class="r"><span class="k" style="width:120px">base · 140ms</span><span style="font:400 var(--body-sm-size)/1 var(--font-mono);color:var(--text-muted)">button fill, focus rim, switch thumb</span></div>
<div class="r"><span class="k" style="width:120px">slow · 220ms</span><span style="font:400 var(--body-sm-size)/1 var(--font-mono);color:var(--text-muted)">budget bar fill, palette mount</span></div>
<div class="r"><span class="k" style="width:120px">easing</span><span style="font:400 var(--body-sm-size)/1 var(--font-mono);color:var(--obs-secondary)">cubic-bezier(.2,.8,.3,1)</span></div>
</div></body></html>
