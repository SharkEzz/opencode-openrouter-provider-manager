<!-- @dsCard group="Colors" viewport="700x120" name="Surface strata" subtitle="Canvas through floating overlay" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--surface-app)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body><div class="sw"><div style="background:var(--surface-canvas);color:var(--text-muted)"><b>canvas</b><span>#000000</span></div><div style="background:var(--surface-app);color:var(--text-muted)"><b>app</b><span>#131313</span></div><div style="background:var(--surface-docked);color:var(--text-muted)"><b>docked</b><span>#1b1b1b</span></div><div style="background:var(--surface-pane);color:var(--text-muted)"><b>pane</b><span>#1f1f1f</span></div><div style="background:var(--surface-raised);color:var(--text-secondary)"><b>raised</b><span>#2a2a2a</span></div><div style="background:var(--obs-surface-container-highest);color:var(--text-secondary)"><b>highest</b><span>#353535</span></div><div style="background:var(--obs-surface-bright);color:var(--text-primary)"><b>bright</b><span>#393939</span></div></div></body></html>
