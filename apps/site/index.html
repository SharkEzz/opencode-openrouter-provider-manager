<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pin a specific OpenRouter endpoint per model in OpenCode, and see what it changes: measured cost, latency and cache hit rates." />
    <title>openrouter-provider-manager</title>
    <script>
      // Apply the theme before first paint: the stored choice, else the system preference.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {}
        var light =
          stored === 'light' ||
          (stored === null && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
