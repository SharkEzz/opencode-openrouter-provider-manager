<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="2 · 4 · 6 · 8 · 12 · full" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--surface-app)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body><div class="r" style="gap:var(--space-lg)">
<div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:48px;height:48px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></i><span class="k">2px</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:48px;height:48px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius)"></i><span class="k">4px</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:48px;height:48px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-md)"></i><span class="k">6px</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:48px;height:48px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></i><span class="k">8px</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:48px;height:48px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-xl)"></i><span class="k">12px</span></div>
<div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:48px;height:48px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-full)"></i><span class="k">full</span></div>
</div></body></html>
