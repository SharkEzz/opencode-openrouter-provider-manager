<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:var(--space-lg);background:var(--surface-app)}.sw{display:flex;gap:2px}.sw>div{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm)}.sw b{font:600 var(--label-sm-size)/1.1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;display:block}.sw span{font:400 10px/1.3 var(--font-mono);opacity:.72;display:block;margin-top:2px}.k{font:600 var(--label-sm-size)/1 var(--font-mono);letter-spacing:var(--label-sm-ls);text-transform:uppercase;color:var(--text-faint)}.rows{display:grid;gap:var(--space-sm)}.r{display:flex;align-items:center;gap:var(--space-md)}</style>
</head><body><div style="position:relative;height:150px;border-radius:var(--radius);overflow:hidden;background:var(--surface-canvas)">

<div style="position:absolute;inset:0;padding:10px;font:400 var(--code-dense-size)/var(--code-dense-lh) var(--font-mono);color:var(--syntax-comment)">const route = await pick({ ceiling: 0.55 });<br>// telemetry: 82 tok/s · cache 41%</div>
<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;padding:var(--space-md) var(--space-lg);background:var(--glass-fill);backdrop-filter:var(--glass-blur);border:1px solid var(--obs-slate-800);border-top:1px solid var(--rim-electric);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);display:flex;align-items:center;gap:var(--space-md);font:400 var(--body-lg-size)/1 var(--font-mono)"><span style="color:var(--obs-primary)">&gt;</span><span style="color:var(--text-primary)">route to model</span><span style="color:var(--text-faint)">…</span><span style="margin-left:auto;display:flex;gap:4px"><kbd style="height:18px;padding:0 5px;border-radius:var(--radius-sm);background:var(--surface-raised);border:1px solid var(--hairline);color:var(--text-muted);font:600 var(--label-sm-size)/16px var(--font-mono);letter-spacing:var(--label-sm-ls)">esc</kbd><kbd style="height:18px;padding:0 5px;border-radius:var(--radius-sm);background:var(--surface-raised);border:1px solid var(--hairline);color:var(--text-muted);font:600 var(--label-sm-size)/16px var(--font-mono);letter-spacing:var(--label-sm-ls)">ctrl+p</kbd></span></div>
</div></body></html>
